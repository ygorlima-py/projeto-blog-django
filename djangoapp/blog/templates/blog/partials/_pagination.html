{% if is_paginated %}
    <nav class="pagination section-content-wide" aria-label="Paginação">
        <div class="pagination-side">
            {% if page_obj.has_previous %}
                <a href="?page={{ page_obj.previous_page_number }}{% if search_value %}&amp;search={{ search_value|urlencode }}{% endif %}">
                    <span aria-hidden="true">←</span>
                    Anterior
                </a>
            {% else %}
                <span aria-disabled="true">
                    <span aria-hidden="true">←</span>
                    Anterior
                </span>
            {% endif %}
        </div>

        <span class="pagination-current" aria-current="page">
            Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}
        </span>

        <div class="pagination-side pagination-side-next">
            {% if page_obj.has_next %}
                <a href="?page={{ page_obj.next_page_number }}{% if search_value %}&amp;search={{ search_value|urlencode }}{% endif %}">
                    Próxima
                    <span aria-hidden="true">→</span>
                </a>
            {% else %}
                <span aria-disabled="true">
                    Próxima
                    <span aria-hidden="true">→</span>
                </span>
            {% endif %}
        </div>
    </nav>
{% endif %}
