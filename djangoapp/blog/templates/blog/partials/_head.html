{% load static %}
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#123d3a">
{% if page and page.slug == 'passagens-aereas' %}
    <meta name="description" content="Pesquise e compare voos para a Tailândia e destinos no mundo todo.">
{% elif post and post.excerpt %}
    <meta name="description" content="{{ post.excerpt|truncatechars:160 }}">
{% elif site_setup.description %}
    <meta name="description" content="{{ site_setup.description }}">
{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="{% static "blog/css/remedy.css" %}">
<link rel="stylesheet" href="{% static "blog/css/style.css" %}">

{% if site_setup.favicon %}
    <link rel="icon" href="{{ site_setup.favicon.url }}" type="image/png">
{% endif %}
