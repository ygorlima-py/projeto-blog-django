{% extends "blog/base.html" %}
{% load rich_text %}
{% block content %}
    <main id="main-content" class="main-content static-page">
        <article class="section-content-article">
            <header class="static-page-header">
                <p>Página</p>
                <h1>{{ page.title }}</h1>
                <span aria-hidden="true"></span>
            </header>
            <div class="article-content page-content">{{ page.content|rich_text }}</div>
        </article>
    </main>
{% endblock content %}
