services:
  djangoapp:
    container_name: djangoapp
    build:
      context: .
    ports:
      - 127.0.0.1:8001:8000
    volumes:
      - ./djangoapp:/djangoapp
      - ./data/web/static:/data/web/static/
      - ./data/web/media:/data/web/media/
    env_file:
      - ./dotenv_files/.env
    depends_on:
      - psql

  agent_worker:
    container_name: agent_worker
    build:
      context: ./agent_app
      dockerfile: Dockerfile
    env_file:
      - ./agent_app/.env
    command: ["python", "-m", "celery", "-A", "main:app", "worker", "--loglevel=INFO", "--concurrency=1"]
    depends_on:
      - djangoapp
      - psql
      - rabbitmq-agent

  psql:
    container_name: psql
    image: postgres:17-alpine
    ports:
    - "127.0.0.1:5433:5432"
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data/
    env_file:
      - ./dotenv_files/.env

  rabbitmq-agent:
    image: rabbitmq:4.2.9-management
    env_file:
    - ./dotenv_files/.env
    ports:
      - "127.0.0.1:5673:5672"
      - "127.0.0.1:15673:15672"
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

